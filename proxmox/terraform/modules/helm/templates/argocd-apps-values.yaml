applications:
  root-app-of-apps:
    namespace: argocd
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: argocd
    source:
      repoURL: https://github.com/vrtexe/homelab-gitops.git
      targetRevision: HEAD
      path: apps
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
projects:
  argocd:
    namespace: argocd
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    description: Argocd Project
    sourceRepos:
      - '*'
    destinations:
      - namespace: argocd
        server: https://kubernetes.default.svc
